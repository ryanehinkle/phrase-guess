name: Unblock stuck Pages deployment (one-time)
on:
  push:
    paths:
      - .github/workflows/unblock-pages-once.yml

permissions:
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Force cancel stuck Pages workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/43095008058/force-cancel"
          status=$(curl --silent --show-error --output /tmp/cancel-response --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${target}")
          echo "Force cancellation API status: ${status}"
          if [ "${status}" = "202" ] || [ "${status}" = "409" ]; then
            echo "Cancel request accepted or target already complete."
          else
            cat /tmp/cancel-response
            exit 1
          fi
